# =========================================================================
#  CONTINUOUS INTEGRATION - Sunrise Dental Clinic Management System
#  CIS6003 Advanced Programming - WRIT1, Task D
# =========================================================================
#  Runs on every push and every pull request. Its job is to answer one
#  question honestly: would this change break the clinic?
#
#  The pipeline deliberately does more than "mvn package":
#    * builds on TWO JDKs, so the project cannot quietly acquire a dependency
#      on the exact JDK that happens to be on the developer's machine;
#    * runs unit AND integration tests, the latter against a real H2 schema
#      with the real Flyway migrations, triggers and constraints;
#    * publishes the test reports and the JaCoCo coverage report as artefacts,
#      so a failure can be diagnosed from the run page without re-running it
#      locally;
#    * fails the build on a dependency with a known critical vulnerability.
# =========================================================================

name: CI

on:
  push:
    branches: [ main, develop, 'feature/**', 'release/**' ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:        # lets a maintainer run it on demand

# A newer push to the same branch cancels the older run - saves minutes and
# means the badge always reflects the newest commit rather than a stale one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  # ---------------------------------------------------------------------
  # Compile and run the whole test suite on every supported JDK.
  # ---------------------------------------------------------------------
  build-and-test:
    name: Build & test (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false      # report BOTH JDKs, not just the first to fail
      matrix:
        java: [ '17', '21' ]

    steps:
      - name: Check out the source
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
          cache: maven          # caches ~/.m2, cutting a clean build by minutes

      - name: Show the toolchain actually in use
        run: |
          java -version
          mvn -version

      - name: Build, run unit tests and run integration tests
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Summarise the test results
        if: always()          # a failing build is exactly when this matters
        run: |
          echo "### Test results (JDK ${{ matrix.java }})" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Module | Suite | Tests | Failures | Errors |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---:|---:|---:|" >> "$GITHUB_STEP_SUMMARY"
          find . -name 'TEST-*.xml' -path '*/target/*' | while read -r f; do
            module=$(echo "$f" | cut -d/ -f2)
            name=$(basename "$f" .xml | sed 's/^TEST-//')
            tests=$(grep -o 'tests="[0-9]*"' "$f" | head -1 | grep -o '[0-9]*')
            fails=$(grep -o 'failures="[0-9]*"' "$f" | head -1 | grep -o '[0-9]*')
            errs=$(grep -o 'errors="[0-9]*"' "$f" | head -1 | grep -o '[0-9]*')
            echo "| $module | $name | $tests | $fails | $errs |" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Publish the test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-jdk${{ matrix.java }}
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
          retention-days: 14

      - name: Publish the code coverage report
        if: always() && matrix.java == '17'
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: '**/target/site/jacoco/**'
          retention-days: 14

      - name: Report coverage in the run summary
        if: always() && matrix.java == '17'
        run: |
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Code coverage (JaCoCo)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Module | Instructions | Lines |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---:|---:|" >> "$GITHUB_STEP_SUMMARY"
          for csv in */target/site/jacoco/jacoco.csv; do
            [ -f "$csv" ] || continue
            module=$(echo "$csv" | cut -d/ -f1)
            awk -F, -v m="$module" 'NR>1 {im+=$4; ic+=$5; lm+=$8; lc+=$9}
              END {
                if (ic+im > 0)
                  printf "| %s | %.1f%% | %.1f%% |\n", m, 100*ic/(ic+im), 100*lc/(lc+lm)
              }' "$csv" >> "$GITHUB_STEP_SUMMARY"
          done

  # ---------------------------------------------------------------------
  # Package the deployable artefacts once the tests have passed.
  # ---------------------------------------------------------------------
  package:
    name: Package deployable artefacts
    runs-on: ubuntu-latest
    needs: build-and-test        # never package something that failed its tests

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      # Tests already passed in the job above; re-running them here would double
      # the pipeline time to prove the same thing twice.
      - name: Package
        run: mvn --batch-mode --no-transfer-progress clean package -DskipTests

      - name: Upload the executable server jar
        uses: actions/upload-artifact@v4
        with:
          name: sunrise-dental-server
          path: dental-server/target/sunrise-dental-server.jar
          retention-days: 30

      - name: Upload the executable desktop client jar
        uses: actions/upload-artifact@v4
        with:
          name: sunrise-dental-client
          path: dental-client/target/sunrise-dental-client.jar
          retention-days: 30

      - name: Smoke-test the packaged server
        run: |
          # Proves the artefact actually STARTS. A jar that builds but will not
          # boot is worse than a build failure, because it looks like success.
          nohup java -jar dental-server/target/sunrise-dental-server.jar \
                --server.port=8080 --clinic.demo.seed-enabled=false > boot.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -fs http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
              echo "The packaged server started and reports healthy."
              exit 0
            fi
            sleep 2
          done
          echo "The packaged server did not become healthy in time. Boot log:"
          tail -100 boot.log
          exit 1

      - name: Upload the boot log if the smoke test failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-boot-log
          path: boot.log

  # ---------------------------------------------------------------------
  # Dependency vulnerability check.
  # ---------------------------------------------------------------------
  security-scan:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    needs: build-and-test
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Build the dependency tree
        run: mvn --batch-mode --no-transfer-progress dependency:tree -DoutputFile=dependency-tree.txt

      - name: Scan for known vulnerabilities
        uses: aquasecurity/trivy-action@v0.24.0
        with:
          scan-type: fs
          scan-ref: .
          # The clinic stores patient data, so a CRITICAL advisory in a
          # dependency is treated as a build failure, not a warning.
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: true

      - name: Publish the dependency tree
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-tree
          path: dependency-tree.txt
