# =========================================================================
#  Test profile - CIS6003 Task C
# =========================================================================
#  Three decisions that make the suite trustworthy:
#
#  1. AN IN-MEMORY DATABASE, BUT THE REAL SCHEMA. Flyway runs the same four
#     H2 migrations the application uses, so the integration tests exercise the
#     genuine tables, unique constraints, CHECK constraints, views, stored
#     functions and triggers. A test schema generated by Hibernate would have
#     none of those, and every constraint test would be meaningless.
#
#  2. NO DEMONSTRATION DATA. Each test creates exactly the rows it needs, so a
#     test can never pass because of a row somebody seeded for a screenshot.
#
#  3. DATABASE PER TEST CLASS. The random name means classes cannot interfere
#     with each other, so the suite is order-independent and safe to run in
#     parallel later.
# =========================================================================

spring:
  datasource:
    # DB_CLOSE_DELAY=-1 keeps the in-memory database alive between connections
    # for the length of the JVM; without it Hikari's first idle close would
    # silently drop the whole schema.
    url: jdbc:h2:mem:dentaltest;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: validate      # still validate: the model must match the real schema
    open-in-view: false
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration/h2
    clean-disabled: false

  h2:
    console:
      enabled: false

  thymeleaf:
    cache: false

  mail:
    host: localhost
    port: 25

server:
  port: 0                     # a random free port, so tests never clash with a running server

clinic:
  notifications:
    enabled: true             # observers still run, so their behaviour is under test
    smtp-enabled: false       # ... but through the console gateway, never real SMTP
    email-enabled: true
    sms-enabled: true
  demo:
    seed-enabled: false       # tests build their own data
  security:
    default-admin-password: Admin@123
    default-reception-password: Reception@123
    default-dentist-password: Dentist@123

management:
  health:
    mail:
      enabled: false

logging:
  level:
    root: WARN
    lk.icbt.cis6003.dental: INFO
    org.flywaydb: INFO
    org.springframework.test: WARN
